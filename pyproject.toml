[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tts_webui_extension.voice_manager"
version = "0.1.0"
description = "Voice Manager extension for TTS WebUI: upload, preview and delete voice reference clips"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["gradio"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["tts_webui_extension*"]
namespaces = true
