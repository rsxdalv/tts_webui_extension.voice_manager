[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tts_webui_extension.voice_manager"
version = "0.1.0"
description = "Voice Manager extension for TTS WebUI: upload, preview and delete voice reference clips"
readme = "README.md"
authors = [{name = "danangboy13"}]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# gradio is provided by the TTS WebUI host
dependencies = []

[project.urls]
Homepage = "https://github.com/rsxdalv/tts_webui_extension.voice_manager"

[project.optional-dependencies]
test = ["pytest", "gradio"]

[tool.setuptools.packages.find]
include = ["tts_webui_extension*"]
namespaces = true
